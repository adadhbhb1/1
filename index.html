<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在跳转…</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.14); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 20px;
    padding: 36px 28px; max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  h1 { font-size: 21px; margin: 0 0 12px; font-weight: 600; }
  p { font-size: 14px; line-height: 1.7; opacity: 0.9; margin: 0 0 22px; }
  a.btn {
    display: block; padding: 15px 20px; border-radius: 12px; text-decoration: none;
    background: #fff; color: #5b4bb8; font-weight: 700; font-size: 16px;
    transition: transform .15s ease;
  }
  a.btn:active { transform: scale(0.97); }
  .hint {
    margin-top: 18px; font-size: 12px; line-height: 1.6; opacity: 0.75;
  }
  code { background: rgba(0,0,0,0.22); padding: 2px 6px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>即将跳转</h1>
    <p>如果按钮没有反应，请点击右上角「···」，选择「在浏览器打开」。</p>
    <a class="btn" id="go" href="https://proxy.567113.xyz/">进入</a>
    <div class="hint">
      备用地址：<br>
      <code>https://p.567113.xyz/</code><br>
      <code>https://a.567113.xyz/</code>
    </div>
  </div>
  <script>
    // 微信内置浏览器里自动跳转经常被拦，所以延迟一点、并且保留手动按钮
    var target = 'https://proxy.567113.xyz/';
    var ua = navigator.userAgent.toLowerCase();
    var inWeixin = ua.indexOf('micromessenger') !== -1;
    if (!inWeixin) {
      setTimeout(function () { location.replace(target); }, 800);
    }
  </script>
</body>
</html>
